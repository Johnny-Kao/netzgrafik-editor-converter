name: Staging - Disconnected Trainrun

on:
  push:
    branches:
      - bugfix/disconnected-trainrun-sections
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run complete Maven reactor tests
        run: mvn --batch-mode install
